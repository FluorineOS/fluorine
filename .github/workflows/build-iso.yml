name: Build ISO

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build without the leading v. Defaults to the VERSION file."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: false

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build-iso:
    name: Build and verify FluorineOS ISO
    runs-on: ubuntu-latest
    timeout-minutes: 150
    container:
      image: debian:trixie
      options: --privileged

    steps:
      - name: Check out the live-build tree
        uses: actions/checkout@v4

      - name: Install build and verification dependencies
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            dosfstools \
            git \
            grub-efi-amd64-bin \
            grub-pc-bin \
            isolinux \
            live-build \
            mtools \
            ovmf \
            qemu-system-x86 \
            squashfs-tools \
            sudo \
            syslinux-efi \
            xorriso
          lb --version
          qemu-system-x86_64 --version

      - name: Restore the live-build bootstrap cache
        uses: actions/cache@v4
        with:
          path: |
            cache/packages.bootstrap
            cache/stages_bootstrap
          key: live-build-${{ runner.os }}-${{ hashFiles('auto/config', 'config/archives/**', 'config/package-lists/**', 'config/packages.chroot/**') }}
          restore-keys: |
            live-build-${{ runner.os }}-

      - name: Resolve the image version
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          version=""
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ -n "${DISPATCH_VERSION}" ]; then
            version="${DISPATCH_VERSION}"
            version="${version#v}"
          elif [ -f VERSION ]; then
            version="$(< VERSION)"
          fi

          version="${version//[[:space:]]/}"

          if ! printf '%s' "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            printf 'Cannot resolve a semantic version from ref %s (got "%s").\n' \
              "${GITHUB_REF_NAME}" "${version}" >&2
            exit 1
          fi

          printf 'Resolved version %s from %s\n' "${version}" "${GITHUB_REF_TYPE}"
          printf 'value=%s\n' "${version}" >> "${GITHUB_OUTPUT}"

      - name: Configure live-build
        env:
          FLUORINE_VERSION: ${{ steps.version.outputs.value }}
        # auto/config derives the image name, ISO application id, and volume label
        # from the version. The architecture suffix is added by live-build itself,
        # so a literal --image-name with -amd64 would produce a doubled suffix.
        run: sudo ./auto/config

      - name: Build the ISO
        run: sudo ./auto/build

      - name: Normalize the ISO name and write the checksum
        env:
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          iso="FluorineOS-${VERSION}-amd64.iso"

          source=""
          for candidate in FluorineOS-*-amd64.hybrid.iso FluorineOS-*-amd64.iso; do
            if [ -f "${candidate}" ]; then
              source="${candidate}"
              break
            fi
          done

          if [ -z "${source}" ]; then
            printf 'No FluorineOS ISO was produced by live-build.\n' >&2
            exit 1
          fi

          if [ "${source}" != "${iso}" ]; then
            mv -- "${source}" "${iso}"
          fi

          sha256sum "${iso}" > "${iso}.sha256"
          sha256sum -c "${iso}.sha256"
          ls -l -- "${iso}" "${iso}.sha256"

      - name: Verify the UEFI firmware boot path
        env:
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/qemu-boot-gate.sh \
            --mode firmware \
            --iso "FluorineOS-${VERSION}-amd64.iso" \
            --sha256-file "FluorineOS-${VERSION}-amd64.iso.sha256" \
            --evidence-dir "${RUNNER_TEMP}/fluorine-boot-gate/firmware" \
            --timeout 60 \
            --memory 2048 \
            --cpus 2 \
            --accel auto

      - name: Verify the live system boots headless
        env:
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/qemu-boot-gate.sh \
            --mode live \
            --iso "FluorineOS-${VERSION}-amd64.iso" \
            --sha256-file "FluorineOS-${VERSION}-amd64.iso.sha256" \
            --evidence-dir "${RUNNER_TEMP}/fluorine-boot-gate/live" \
            --timeout 90 \
            --memory 2048 \
            --cpus 2 \
            --accel auto

      - name: Upload the ISO as a workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: FluorineOS-${{ steps.version.outputs.value }}-amd64
          path: |
            FluorineOS-${{ steps.version.outputs.value }}-amd64.iso
            FluorineOS-${{ steps.version.outputs.value }}-amd64.iso.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FluorineOS ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          body: |
            FluorineOS ${{ steps.version.outputs.value }} (amd64)

            Live image built from the Debian 13 (trixie) live-build tree, with the
            Hyprland session, Calamares installer, and the fluorine-desktop,
            fluorine-artwork, and fluorine-keyring packages.

            Every published image passed two automated checks before upload:

            - UEFI firmware handoff: OVMF started the ISO boot entry.
            - Headless live boot: the kernel, initramfs, and squashfs mounted, the
              system reached graphical.target, and the log was free of kernel
              panics and squashfs errors.

            Highlights in this release:

            - flr-doctor reports session, font, keyring, and APT repository health
              with a plain summary of OK, WARN, and INFO findings.
            - A one-time first-login guide shows the Hyprland keybindings and then
              leaves a marker so it never repeats.
            - Waybar exposes network, Bluetooth, and power profile controls, and
              kanshi applies display layouts when monitors are connected.
            - Signed APT repository for in-place upgrades at
              https://fluorineos.github.io/apt-repo

            Existing installations upgrade in place:

                apt update
                apt upgrade

            Verify the download before writing it to media:

                sha256sum -c FluorineOS-${{ steps.version.outputs.value }}-amd64.iso.sha256

            The image includes a shim-based UEFI boot path. If the firmware rejects
            the bootloader, disable Secure Boot or select the "Safe Graphics" menu
            entry when the GPU cannot provide a hardware accelerated renderer.

            Documentation and downloads: https://fluorineos.pages.dev
          files: |
            FluorineOS-${{ steps.version.outputs.value }}-amd64.iso
            FluorineOS-${{ steps.version.outputs.value }}-amd64.iso.sha256
