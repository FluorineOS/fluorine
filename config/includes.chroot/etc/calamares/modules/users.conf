# FluorineOS user, group, and password policy.
#
# This file exists so the policy is a FluorineOS decision rather than a property
# of whatever calamares-settings-debian happens to ship. Debian's file accepts a
# one-character password and leaves /etc/hosts at its package default, which is
# why every sudo invocation on an installed system printed
# "unable to resolve host".
#
# Policy
# ------
# Minimum length 8, no character-class rules, no maximum length.
#   Length dominates composition for offline guessing resistance. Character
#   rules ("must contain a digit") push users toward predictable substitutions
#   and are not required by Debian's own tools. There is deliberately no
#   libpwquality section: libpwquality is a build-time optional dependency of
#   Calamares, and a build without it would drop the check silently instead of
#   failing.
#
# Root stays locked (setRootPassword: false). FluorineOS is sudo-only; the
# created user is placed in sudo and receives /etc/sudoers.d/10-installer. The
# live session uses the same group, so the privilege model is identical before
# and after installation.
#
# No autologin. greetd authenticates every session, including the first one.
---
userGroup: users

# Backlight permissions are group based, not seat based: udev cannot grant ACLs
# on sysfs attributes, so brightness-udev chgrp/chmods the sysfs files instead.
# It sets /sys/class/backlight to group video and /sys/class/leds to group
# input. Without both groups the brightness keys change nothing, and the
# failure is silent because the keybinding discards the error.
#
# input does not widen access the session did not already have: logind tags
# input event nodes uaccess for the active seat, so the logged-in user can
# already read them.
defaultGroups:
  - name: users
    must_exist: true
    system: true
  - cdrom
  - floppy
  - sudo
  - audio
  - dip
  - video
  - plugdev
  - netdev
  - lpadmin
  - scanner
  - bluetooth
  - input

sudoersGroup: sudo
autologinGroup: autologin

setRootPassword: false
doReusePassword: false

displayAutologin: false
doAutologin: false

passwordRequirements:
  minLength: 8
  maxLength: -1

allowWeakPasswords: false
allowWeakPasswordsDefault: false

user:
  shell: /bin/bash
  forbidden_names: [ root ]

home_permissions: "o700"

# writeHostsFile must stay true. The module writes /etc/hostname and the
# matching 127.0.1.1 entry in /etc/hosts from the hostname the user chooses, so
# hostname resolution (and therefore sudo) works on first boot without any
# post-install step. The live image ships the same pair for the live session;
# see config/hooks/normal/0100-branding.hook.chroot.
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "fluorine"
