# Rebuild every installed kernel's initramfs in the target.
#
# This step is what makes an encrypted installation bootable. The initramfs that
# arrives in the squashfs was generated for the live medium: it has no
# /etc/crypttab for the target and no keyfile, so it cannot unlock the encrypted
# root. initramfscfg adds the hook and this module runs update-initramfs.
#
# kernel "all" covers the case where the target carries more than one kernel
# after an upgrade during installation.
#
# be_unsafe stays false, which keeps initramfs-tools' CVE-2019-13179 mitigation:
# the image contains /crypto_keyfile.bin and must not be world-readable.
---
kernel: "all"
be_unsafe: false
