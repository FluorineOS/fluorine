# Runs outside the target chroot so ${ROOT} resolves to the installed system and
# so the live session's Calamares log can be read from the live filesystem.
#
# Calamares substitutes ${ROOT} itself and rejects shell default syntax such as
# ${ROOT:-}, so only the plain variable form is used here. Every command starts
# with a non-empty ${ROOT} test: an empty ROOT fails the job instead of acting on
# the live system.
#
# The helpers are invoked through `bash <path>` rather than as executables. The
# scripts are 0755 in the git index, but this project has repeatedly shipped a
# Windows checkout whose payload lost the exec bit, which would turn the final
# install step into exit 126 after the disk had been written.
#
# Order matters. Snapper initialisation runs first, the cleanup step removes the
# live-session and Debian-installer residue, and the log is copied last so it
# contains as much of the session as possible.
---
dontChroot: true
timeout: 300
script:
  # The filesystem type is measured from the mounted target and passed in.
  # Inside the chroot, findmnt resolves / against the live mount namespace and
  # reports the live overlay, which made every real install skip Snapper
  # silently while still reporting success.
  - sh -c 'test -n "${ROOT}" && chroot "${ROOT}" bash /usr/lib/fluorineos/snapper-init --root-fstype "$(stat -f -c %T "${ROOT}")"'
  # Target-side cleanup. --installed-target is what tells the script the
  # filesystem it is running on is the installation, not the live session.
  - sh -c 'test -n "${ROOT}" && chroot "${ROOT}" bash /usr/lib/fluorineos/installer-cleanup --installed-target'
  # Preserve the Calamares session log into /var/log/fluorineos-install, which
  # is its own Btrfs subvolume and therefore survives a root rollback.
  - sh -c 'test -n "${ROOT}" && bash /usr/lib/fluorineos/installer-log-preserve "${ROOT}"'
