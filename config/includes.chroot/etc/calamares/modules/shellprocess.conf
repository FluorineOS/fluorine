# Runs outside the target chroot so ${ROOT} resolves to the installed system.
# The live session's passwordless installer rules and desktop shortcut must not
# survive installation.
#
# Calamares substitutes ${ROOT} itself and rejects shell default syntax such as
# ${ROOT:-}, so only the plain variable form is used here.
---
dontChroot: true
timeout: 30
script:
  - sh -c 'test -n "${ROOT}" && rm -f "${ROOT}/etc/sudoers.d/99-fluorine-live-installer"'
  - sh -c 'test -n "${ROOT}" && rm -f "${ROOT}/etc/skel/Desktop/install-fluorineos.desktop"'
  - sh -c 'test -n "${ROOT}" && rm -f "${ROOT}"/home/*/Desktop/install-fluorineos.desktop'
