# FluorineOS partitioning configuration for Calamares 3.3.
#
# Only the keys that must differ from the Calamares defaults are set here. Every
# other setting keeps the module default, because nothing else is defined.
#
# Automated partitioning offers full-disk encryption whenever the installer can
# create the layout, and the container format is pinned to LUKS2 so the key
# derivation and header format are the current default rather than the legacy
# LUKS1 layout. cryptsetup-initramfs is installed in the image, so the boot
# initramfs can unlock the root volume.
#
# The default filesystem is Btrfs, which Calamares creates both on a plain disk
# and inside a LUKS2 container. The subvolume layout keeps the system, user
# data, and snapshots separate so a rollback never touches /home and the
# Snapper store never appears in the root subvolume.

enableLuksAutomatedPartitioning: true
luksGeneration: luks2

defaultFileSystemType: btrfs

btrfsSubvolumes:
  - mountPoint: /
    subvolume: /@
  - mountPoint: /home
    subvolume: /@home
  - mountPoint: /.snapshots
    subvolume: /@snapshots
