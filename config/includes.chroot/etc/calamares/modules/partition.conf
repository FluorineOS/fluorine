# FluorineOS partitioning configuration for Calamares 3.3.
#
# Only the keys that must differ from the Calamares defaults are set here. Every
# other setting keeps the module default, because nothing else is defined.

enableLuksAutomatedPartitioning: true

# LUKS1 is a bootability requirement, not a preference.
#
# Debian 13 ships GRUB 2.12. GRUB can read a LUKS1 header and derive its key,
# but it cannot unlock a LUKS2 keyslot: cryptsetup creates LUKS2 keyslots with
# Argon2id and GRUB has no Argon2 implementation. luksGeneration selects the
# container format only; it never selects the key derivation function, so
# `luks2` produces an installation that completes, prompts for the passphrase at
# the GRUB menu, rejects the correct passphrase and drops to the `grub>` rescue
# prompt. grub-probe also fails to recognise LUKS2 headers, so grub-mkconfig
# cannot emit the cryptomount line that /boot needs when it lives inside the
# encrypted root.
#
# The same setting is used by the manual partitioning page, so automated and
# manual encrypted installs behave identically. See docs/INSTALLER.md.
luksGeneration: luks1

defaultFileSystemType: btrfs

# Four subvolumes, each with a distinct rollback scope:
#   @           the system. Snapshotted and rolled back as a unit.
#   @home       user data. Never part of a root rollback.
#   @snapshots  the Snapper store, so snapshots never appear inside @.
#   @log        logs. Kept out of @ so that log writes do not churn every
#               snapshot, and so a rollback of @ does not discard the journal or
#               /var/log/fluorineos-install, which is where installer
#               diagnostics are written.
btrfsSubvolumes:
  - mountPoint: /
    subvolume: /@
  - mountPoint: /home
    subvolume: /@home
  - mountPoint: /.snapshots
    subvolume: /@snapshots
  - mountPoint: /var/log
    subvolume: /@log
