# FluorineOS finished page.
#
# The reboot goes through systemd so the live session's shutdown path is not
# reused, and the user chooses whether to reboot: an automatic reboot would hide
# a failed first boot behind a black screen.
#
# notifyOnFinished stays false. The notification needs the live session's DBus
# from a root process, which is exactly the kind of privilege the live sudoers
# rule no longer grants.
---
restartNowMode: user-unchecked
restartNowCommand: "systemctl -i reboot"
notifyOnFinished: false
