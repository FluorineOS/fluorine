# DOCUMENTATION ONLY - this module is not in the Calamares sequence.
#
# settings.conf lists this file in its "Deliberately not in the sequence" block.
# It is kept as the record of why: the greetd handler in this module rewrites
# /etc/greetd/config.toml with a greeter user that does not exist in this image,
# which makes greetd exit immediately on the next boot.
# config/includes.chroot/etc/greetd/config.toml is authoritative. Do not add
# `displaymanager` to the sequence without replacing that handler.
---
displaymanagers:
  - greetd
basicSetup: false
