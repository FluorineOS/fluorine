# FluorineOS locale configuration.
#
# The timezone page still lets the user choose; this only removes the dependency
# on Calamares' compiled-in America/New_York default. useSystemTimezone inherits
# whatever the live session is set to (UTC unless the operator changed it), which
# is a defensible default and is never a city the user did not pick.
#
# GeoIP is disabled: it needs internet access, and the installer must work with
# no network at all.
#
# The locale the user selects is written to /etc/locale.gen and generated by the
# localecfg module, which is fatal on failure. `locales` is therefore an
# explicit entry in config/package-lists/base.list.chroot rather than an
# accidental transitive dependency.
---
useSystemTimezone: true

geoip:
  style: "none"
