# FluorineOS keyboard configuration.
#
# The layout page still lets the user choose; this only pins where the result is
# written.
#
# useLocale1 must stay false. systemd-localed is reachable from the live session
# but not from the target chroot, so the localed path would leave
# /etc/default/keyboard unwritten in the installed system and the console keymap
# unset. writeEtcDefaultKeyboard is the Debian-native equivalent and always
# works.
#
# convertedKeymapPath is left empty on purpose: it names a directory of
# X11-to-kbd keymaps, and Debian's kbd package does not ship that tree. A wrong
# path would make the module try to write a keymap that cannot exist.
---
writeEtcDefaultKeyboard: true
useLocale1: false
convertedKeymapPath: ""

configure:
  kwin: false
  gnome: false
