# Offline install: never refresh the package database, the ISO already carries
# everything the target needs. No repository and no mirror are configured here,
# and no install operation runs, so the module never needs the network.
#
# Placement: this step runs before initramfscfg and initramfs. live-config
# diverts update-initramfs, so removing the live-* packages first is what lets
# the initramfs be rebuilt for the target. Running it before bootloader also
# means a package failure aborts the install before a bootloader is written.
#
# `apt-get remove` on a known but not installed name exits 0 ("not installed, so
# not removed"), so entries that are absent from a build are harmless. That
# depends on the target keeping the apt index that came from the squashfs:
# update_db is false and nothing prunes /var/lib/apt/lists.
---
backend: apt
update_db: false
operations:
  - remove:
      - live-boot
      - live-boot-doc
      - live-config
      - live-config-systemd
      - calamares
      - calamares-settings-debian
