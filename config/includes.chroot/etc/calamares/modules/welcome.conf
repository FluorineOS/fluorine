# FluorineOS welcome page: resource floors and blocking behaviour.
#
# The installer is offline by design, so no condition in *check* performs a
# network request. `internet` is deliberately absent; adding it would make the
# welcome page depend on connectivity and would also let GeoIP leak the
# installation to a third party.
#
# Both floors are blocking (*required*), not advisory. A too-small disk must
# stop on the welcome page: a dismissible warning lets the user reach the
# partition module, write a partition table, and only fail later inside unpackfs
# with no rollback.
---
showSupportUrl: true
showKnownIssuesUrl: true
showReleaseNotesUrl: true
showDonateUrl: false

requirements:
  # The 0.4.0 squashfs is about 1.4 GiB compressed and unpacks to roughly 6 GiB.
  # 15 GiB leaves room for the ESP, the swap partition, Btrfs metadata, and at
  # least one pre-update snapshot, which is the smallest layout that stays
  # usable rather than merely installable.
  requiredStorage: 15.0
  # Hyprland plus Calamares peak below 2 GiB, but unpackfs streams the whole
  # squashfs through page cache. Below 2.5 GiB the install can be OOM-killed
  # after the disk has been written.
  requiredRam: 2.5

  check:
    - storage
    - ram

  required:
    - storage
    - ram
