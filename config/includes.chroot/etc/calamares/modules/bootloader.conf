# FluorineOS bootloader configuration.
#
# GRUB, unsigned, with a fixed EFI bootloader id.
#
# Secure Boot
# -----------
# FluorineOS does not install a signed boot chain. A Secure Boot enabled
# firmware refuses an unsigned grubx64.efi, so the installed system would not
# boot while the live ISO (built with shim) did. auto/config therefore no longer
# builds the live medium with Secure Boot support: the medium and the installed
# system make the same claim, and firmware has to allow an unsigned bootloader
# before the ISO boots at all. That turns a silent post-install failure into a
# refusal at the first step. See docs/INSTALLER.md.
#
# efiBootloaderId is pinned rather than taken from branding.desc. The ESP
# directory and the NVRAM entry have to be stable across branding changes, and a
# missing branding key would abort the module with a KeyError.
#
# Kernel parameters are not set here. /etc/default/grub ships in the image and is
# authoritative for the primary and recovery entries; the bootloader module only
# uses *kernelParams* for systemd-boot and refind.
---
efiBootLoader: "grub"
efiBootloaderId: "FluorineOS"

# Copy grubx64.efi to EFI/BOOT/BOOTX64.EFI as well, so a board whose NVRAM entry
# is lost still finds the installed system.
installEFIFallback: true
installHybridGRUB: false

grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
