# FluorineOS fstab and crypttab generation.
#
# crypttabOptions must carry keyscript=/bin/cat on Debian. initramfs-tools only
# honours the keyfile that luksbootkeyfile installs when the crypttab entry asks
# for it through a keyscript; with the upstream default of plain "luks", the
# cryptroot hook ignores /crypto_keyfile.bin, the initramfs prompts for the
# passphrase a second time, and an unattended boot cannot unlock the root volume
# at all.
#
# tmpOptions is required by the module schema. tmpfs for /tmp is only selected
# for SSD layouts; the default keeps /tmp on the root subvolume so a snapshot
# rollback stays consistent with what was running.
---
crypttabOptions: luks,keyscript=/bin/cat

tmpOptions:
  default:
    tmpfs: false
    options: ""
  ssd:
    tmpfs: true
    options: "defaults,noatime,mode=1777"
