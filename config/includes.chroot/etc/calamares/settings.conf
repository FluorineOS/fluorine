# Calamares settings for the FluorineOS live image.
#
# Configuration ownership
# -----------------------
# Every module executed below reads a configuration file from this directory
# (config/includes.chroot/etc/calamares/modules/), which is installed to
# /etc/calamares/modules/ in the image. The repository therefore owns the
# installer's behaviour: a calamares or calamares-settings-debian update cannot
# silently change the password policy, the welcome thresholds, the bootloader
# target, the fstab/crypttab options, or the initramfs handling.
#
# The only module that keeps a packaged default is `mount` (mount.conf from
# calamares-settings-debian): it only provides the bind-mount list used while
# executing jobs in the target and has no user-visible effect.
#
# Module order is load-bearing; see docs/INSTALLER.md.
---
branding: fluorineos

# Debian installs the module plugins under the multiarch directory. Without an
# explicit list Calamares falls back to compiled defaults that omit it, and every
# configured module is reported as "not found in module search paths".
modules-search:
  - local
  - /usr/lib/x86_64-linux-gnu/calamares/modules

# View modules are shown to the user; exec modules run unattended.
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      # luksbootkeyfile writes /crypto_keyfile.bin and registers it with every
      # LUKS container created in this session, so GRUB unlocks the encrypted
      # root once and the initramfs reuses the keyfile instead of prompting
      # again.
      - luksbootkeyfile
      - users
      - hwclock
      # packages must run before the initramfs steps. initramfs-tools refuses to
      # rebuild an image while the live-boot/live-config diverts are installed,
      # and those packages are removed here. Running packages first also means a
      # package failure aborts the install before a bootloader is written.
      - packages
      # initramfscfg installs the initramfs-tools hook that copies /etc/crypttab
      # and /crypto_keyfile.bin into the image; initramfs rebuilds it with
      # update-initramfs. Without both, an encrypted install has no way to
      # unlock its root volume: the initramfs carried over from the squashfs was
      # generated for the live medium and knows nothing about the target's
      # crypttab.
      - initramfscfg
      - initramfs
      - bootloader
      - shellprocess
      - umount
  - show:
      - finished

# Deliberately not in the sequence
# -------------------------------
# displaymanager   modules/displaymanager.conf is documentation only. Its greetd
#                  handler rewrites /etc/greetd/config.toml with a greeter user
#                  that does not exist in this image, which makes greetd exit on
#                  the next boot. /etc/greetd/config.toml is authoritative.
# networkcfg       Copies the live session's NetworkManager connection profiles
#                  into the target, including any Wi-Fi PSK the operator used on
#                  the live medium. The installer is offline by design and
#                  NetworkManager starts empty on first boot.
# services-systemd NetworkManager, bluetooth, greetd and ufw are enabled inside
#                  the image by config/hooks/normal/0200-services; the symlinks
#                  travel in the squashfs, so the module had no configuration
#                  and nothing to do.
# grubcfg          /etc/default/grub is shipped by this repository and is the
#                  authoritative source for kernel parameters, the theme and
#                  GRUB_ENABLE_CRYPTODISK. grubcfg would rewrite those keys.
# luksopenswaphookcfg
#                  mkinitcpio-only (it writes an openswap hook for Arch-style
#                  initramfs). Debian uses initramfs-tools, which has no
#                  equivalent, so running it would configure nothing.
