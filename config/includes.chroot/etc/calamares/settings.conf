# Calamares settings for the FluorineOS 0.0.1 live image.
---
branding: fluorineos

# View modules are shown to the user; exec modules run unattended.
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - luksbootkeyfile
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - bootloader
      - packages
      - shellprocess
      - umount
  - show:
      - finished
