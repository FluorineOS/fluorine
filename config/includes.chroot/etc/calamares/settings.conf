# Calamares settings for the FluorineOS 0.0.1 live image.
---
branding: fluorineos

# Debian installs the module plugins under the multiarch directory. Without an
# explicit list Calamares falls back to compiled defaults that omit it, and every
# configured module is reported as "not found in module search paths".
modules-search:
  - local
  - /usr/lib/x86_64-linux-gnu/calamares/modules

# View modules are shown to the user; exec modules run unattended.
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - luksbootkeyfile
      - users
      # The displaymanager module is deliberately skipped. Its greetd handler
      # rewrites /etc/greetd/config.toml with a greeter user that does not exist
      # in this image, which makes greetd exit immediately on the next boot.
      # config/includes.chroot/etc/greetd/config.toml is authoritative instead.
      - networkcfg
      - hwclock
      - services-systemd
      - bootloader
      - packages
      - shellprocess
      - umount
  - show:
      - finished
